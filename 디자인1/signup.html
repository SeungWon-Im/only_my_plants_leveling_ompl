<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 - 내 식물만 레벨업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#eef1ee; --paper:#ffffff; --ink:#141a16; --sub:#6b7770; --mist:#f1f4f2; --leaf:#19a463; --err:#d6453d; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; -webkit-font-smoothing:antialiased; }
  #app { max-width:440px; min-height:100vh; margin:0 auto; background:var(--paper); padding:20px 22px 130px; }
  .top { display:flex; align-items:center; height:40px; }
  .back { width:40px; height:40px; border-radius:50%; background:var(--mist); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink); font-size:18px; }
  h1 { font-size:28px; line-height:1.3; font-weight:800; letter-spacing:-0.04em; margin-top:28px; }
  .lead { font-size:15px; color:var(--sub); margin-top:8px; line-height:1.6; }
  .field { margin-top:20px; }
  .field label { display:block; font-size:13px; font-weight:600; color:var(--sub); margin-bottom:8px; }
  input { width:100%; font:inherit; font-size:16px; padding:15px 16px; border:2px solid transparent; border-radius:14px; background:var(--mist); color:var(--ink); outline:none; transition:border-color .15s; }
  input:focus { border-color:var(--leaf); background:#fff; }
  .msg { min-height:22px; margin-top:14px; font-size:14px; font-weight:600; color:var(--err); }
  .msg.ok { color:var(--leaf); }
  .switch { margin-top:10px; text-align:center; font-size:14px; color:var(--sub); }
  .switch a { color:var(--ink); font-weight:700; margin-left:6px; }
  .dock { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; pointer-events:none; }
  .dock-in { width:100%; max-width:440px; padding:44px 22px 22px; pointer-events:auto; background:linear-gradient(to top,#fff 62%,rgba(255,255,255,0)); }
  .cta { width:100%; border:0; font:inherit; font-size:17px; font-weight:700; letter-spacing:-0.02em; padding:18px; border-radius:18px; background:var(--ink); color:#fff; cursor:pointer; transition:transform .12s; }
  .cta:active { transform:scale(.98); }
  button:focus-visible, a:focus-visible { outline:3px solid var(--leaf); outline-offset:2px; }
</style>
</head>
<body>
<div id="app">
  <header class="top"><a class="back" href="login.html" aria-label="로그인 페이지로">←</a></header>

  <h1>회원가입</h1>
  <p class="lead">아이디와 닉네임만 정하면 바로 시작할 수 있어요.</p>

  <div class="field">
    <label for="id">아이디 (영문·숫자 4~16자)</label>
    <input type="text" id="id" autocomplete="username" autocapitalize="off" maxlength="16">
  </div>
  <div class="field">
    <label for="nick">닉네임</label>
    <input type="text" id="nick" maxlength="10">
  </div>
  <div class="field">
    <label for="pw">비밀번호 (4자 이상)</label>
    <input type="password" id="pw" autocomplete="new-password">
  </div>
  <div class="field">
    <label for="pw2">비밀번호 확인</label>
    <input type="password" id="pw2" autocomplete="new-password">
  </div>
  <div class="msg" id="msg" role="alert"></div>

  <p class="switch">이미 계정이 있나요?<a href="login.html">로그인</a></p>
</div>

<nav class="dock">
  <div class="dock-in"><button class="cta" id="submit" type="button">등록</button></div>
</nav>

<script>
/* 저장 키: pl_users {아이디:{pw,nick,uploads}}, pl_session (로그인한 아이디) — 다른 페이지와 공유 */
const $ = s => document.querySelector(s);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e){ return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };

function join(){
  const id = $('#id').value.trim(), nick = $('#nick').value.trim(), pw = $('#pw').value, pw2 = $('#pw2').value;
  const msg = $('#msg');
  const users = load('pl_users', {});
  if (!/^[A-Za-z0-9]{4,16}$/.test(id)) return msg.textContent = '아이디는 영문·숫자 4~16자로 입력해주세요.';
  if (users[id])                       return msg.textContent = '이미 사용 중인 아이디예요.';
  if (!nick)                           return msg.textContent = '닉네임을 입력해주세요.';
  if (pw.length < 4)                   return msg.textContent = '비밀번호는 4자 이상이어야 해요.';
  if (pw !== pw2)                      return msg.textContent = '비밀번호가 서로 달라요.';

  users[id] = { pw, nick, uploads: 0 };
  if (!save('pl_users', users)) return msg.textContent = '저장하지 못했어요. 브라우저 저장소 설정을 확인해주세요.';
  location.href = 'login.html?joined=' + encodeURIComponent(id);   // 등록 후 로그인 페이지로
}
$('#submit').onclick = join;
document.addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
</script>
</body>
</html>
