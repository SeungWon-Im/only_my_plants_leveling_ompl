<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 식물 - 내 식물만 레벨업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#eef1ee; --paper:#ffffff; --ink:#141a16; --sub:#6b7770; --mist:#f1f4f2; --leaf:#19a463; --err:#d6453d; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; -webkit-font-smoothing:antialiased; }
  #app { max-width:440px; min-height:100vh; margin:0 auto; background:var(--paper); padding:20px 22px 120px; }

  .top { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; height:40px; }
  .round { width:40px; height:40px; border-radius:50%; background:var(--mist); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink); font-size:18px; }
  .round.add { background:var(--ink); color:#fff; font-size:22px; }
  .top h1 { text-align:center; font-size:17px; font-weight:800; letter-spacing:-0.03em; }

  /* 레벨 */
  .level { margin-top:24px; padding:20px; border-radius:22px; background:var(--mist); }
  .level .row { display:flex; justify-content:space-between; align-items:baseline; }
  .lv { font-size:28px; font-weight:800; letter-spacing:-0.04em; color:var(--leaf); }
  .level .hint { font-size:13px; color:var(--sub); }
  .bar { height:12px; border-radius:999px; background:#fff; margin-top:12px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; border-radius:999px; background:var(--leaf); transition:width .4s; }

  .humid { margin-top:18px; font-size:14px; color:var(--sub); }
  .humid b { color:var(--ink); font-size:16px; margin:0 4px; }

  /* 식물 카드 */
  .plant { margin-top:16px; padding:18px; border-radius:24px; border:2px solid var(--mist); }
  .head { display:flex; align-items:center; gap:14px; }
  .avatar { width:64px; height:64px; flex:none; border-radius:50%; background:var(--mist) center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:26px; }
  .avatar.sq { border-radius:16px; margin-left:auto; font-size:20px; }
  .name { font-size:18px; font-weight:800; letter-spacing:-0.03em; }
  .meta { font-size:13px; color:var(--sub); margin-top:3px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .chip { font-size:12px; font-weight:600; background:var(--mist); border-radius:999px; padding:6px 11px; }

  .daily { margin-top:16px; padding-top:14px; border-top:2px solid var(--mist); }
  .daily h3 { font-size:13px; color:var(--sub); font-weight:600; }
  .chk { display:flex; align-items:center; gap:10px; margin-top:12px; font-size:15px; font-weight:500; min-height:36px; }
  .chk input { width:22px; height:22px; accent-color:var(--leaf); flex:none; }
  .chk .right { margin-left:auto; display:flex; gap:6px; align-items:center; font-size:12px; color:var(--sub); text-align:right; }
  .done { color:var(--leaf); font-weight:700; }
  .pill { border:0; font:inherit; font-size:13px; font-weight:700; border-radius:999px; padding:8px 14px; background:var(--mist); color:var(--ink); cursor:pointer; }
  .pill.dark { background:var(--ink); color:#fff; }
  .pill:disabled { opacity:.35; cursor:default; }

  .foot { display:flex; gap:8px; margin-top:16px; }
  .foot a, .foot button { flex:1; text-align:center; text-decoration:none; border:0; font:inherit; font-size:14px; font-weight:700; padding:13px; border-radius:14px; background:var(--mist); color:var(--ink); cursor:pointer; }
  .foot .del { flex:none; width:80px; color:var(--err); }

  .empty { text-align:center; padding:70px 0 40px; color:var(--sub); line-height:1.7; }
  .empty a { display:inline-block; margin-top:18px; text-decoration:none; background:var(--ink); color:#fff; font-weight:700; padding:14px 22px; border-radius:14px; }

  .toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,30px); background:var(--ink); color:#fff; padding:13px 20px; border-radius:999px; font-size:14px; font-weight:600; opacity:0; transition:.25s; pointer-events:none; z-index:9; }
  .toast.on { opacity:1; transform:translate(-50%,0); }
  button:focus-visible, a:focus-visible, input:focus-visible { outline:3px solid var(--leaf); outline-offset:2px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="round" href="index.html" aria-label="홈으로">←</a>
    <h1>내 식물</h1>
    <a class="round add" href="register.html" aria-label="식물 등록">+</a>
  </header>

  <section class="level">
    <div class="row"><div class="lv" id="lvText">Lv.1</div><div class="hint" id="lvHint"></div></div>
    <div class="bar"><i id="lvBar"></i></div>
  </section>

  <div class="humid">습도<b id="humid">--%</b>현재 (예시값)</div>

  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* 저장 키: pl_users, pl_session, pl_plants {아이디:[식물]} — 다른 페이지와 공유 */
const $ = s => document.querySelector(s);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e){ return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const dayDiff = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 864e5);

/* login.html 이 완성되면 false -> true (register.html 과 같이 바꿔주세요) */
const REQUIRE_LOGIN = false;
const users = load('pl_users', {});
let session = load('pl_session', null);
const loggedIn = !!users[session];
if (!loggedIn) { if (REQUIRE_LOGIN) location.replace('login.html'); session = 'guest'; }

const allPlants = load('pl_plants', {});
const list = allPlants[session] || (allPlants[session] = []);

/* 올린 사진 수 (로그인 안 한 테스트 계정은 따로 저장) */
const getUploads = () => loggedIn ? (users[session].uploads || 0) : load('pl_guest_uploads', 0);
const setUploads = n => loggedIn ? (users[session].uploads = n, save('pl_users', users)) : save('pl_guest_uploads', n);

/* 식물 종류 정보 (register.html 의 SPECIES 와 같은 목록, API 연결하면 같이 교체) */
const SPECIES = {
  '몬스테라':{water:7,humid:'50~70%'}, '스투키':{water:14,humid:'30~50%'}, '산세베리아':{water:14,humid:'30~50%'},
  '선인장':{water:21,humid:'20~40%'}, '스킨답서스':{water:7,humid:'50~70%'}, '고무나무':{water:7,humid:'40~60%'},
  '율마':{water:3,humid:'60~70%'}, '페페로미아':{water:10,humid:'50~60%'}
};

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

function readImage(file, cb){
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, 320 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* 레벨: 사진 3장마다 레벨업 */
function renderLevel(){
  const total = getUploads(), prog = total % 3;
  $('#lvText').textContent = 'Lv.' + (Math.floor(total / 3) + 1);
  $('#lvBar').style.width = (prog / 3 * 100) + '%';
  $('#lvHint').textContent = `사진 ${prog}/3 · ${3 - prog}장 더 올리면 레벨업`;
}

function render(){
  renderLevel();
  $('#humid').textContent = render.h || (render.h = (40 + Math.floor(Math.random() * 26)) + '%');
  const box = $('#list'), t = todayStr();
  if (!list.length) {
    box.innerHTML = `<div class="empty">아직 등록한 식물이 없어요.<br>첫 식물을 등록해볼까요?<br><a href="register.html">식물 등록하기</a></div>`;
    return;
  }
  box.innerHTML = list.map(p => {
    const sp = SPECIES[p.species] || { water:7, humid:'-' };
    const todayPhoto = (p.photos || {})[t], thumb = todayPhoto;
    const watered = p.lastWatered === t;
    let waterHint = '';
    if (p.lastWatered) {
      const left = dayDiff(p.lastWatered, t) + sp.water;
      waterHint = left <= 0 ? '물 줄 때예요' : `다음 물주기 D-${left}`;
    }
    const since = p.date ? `${p.date.replaceAll('-', '.')} · ${Math.max(0, dayDiff(t, p.date)) + 1}일째` : (p.year ? p.year + '년' : '');
    return `
    <article class="plant" data-id="${esc(p.id)}">
      <div class="head">
        <div class="avatar" style="${p.photo ? `background-image:url(${p.photo})` : ''}">${p.photo ? '' : '🪴'}</div>
        <div>
          <div class="name">${esc(p.nick)}</div>
          <div class="meta">${esc(p.species)} · ${esc(since)}</div>
        </div>
        <div class="avatar sq" style="${thumb ? `background-image:url(${thumb})` : ''}">${thumb ? '' : '📷'}</div>
      </div>
      <div class="chips">
        <span class="chip">💧 ${sp.water}일마다</span>
        <span class="chip">🌫️ ${esc(sp.humid)}</span>
      </div>
      <div class="daily">
        <h3>일일 체크</h3>
        <div class="chk">
          <input type="checkbox" disabled ${todayPhoto ? 'checked' : ''} aria-label="사진 업로드 여부">
          <span>사진 올리기</span>
          <span class="right">${todayPhoto
            ? '<span class="done">오늘 업로드 완료</span>'
            : '<button class="pill dark act-upload" type="button">사진 올리기</button>'}</span>
        </div>
        <div class="chk">
          <input type="checkbox" class="act-water" ${watered ? 'checked' : ''} aria-label="오늘 물주기">
          <span>물주기 (${sp.water}일 마다)</span>
          <span class="right">${esc(waterHint)}</span>
        </div>
      </div>
      <div class="foot">
        <a href="register.html?edit=${encodeURIComponent(p.id)}">정보 수정</a>
        <button class="del act-del" type="button">삭제</button>
      </div>
    </article>`;
  }).join('');
}

$('#list').addEventListener('click', e => {
  const card = e.target.closest('.plant'); if (!card) return;
  const p = list.find(x => x.id === card.dataset.id), t = todayStr();
  if (e.target.closest('.act-upload')) {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      readImage(f, d => {
        p.photos = p.photos || {};
        if (p.photos[t]) return;   // 오늘 이미 올림
        p.photos[t] = d;
        const before = Math.floor(getUploads() / 3), now = getUploads() + 1;
        setUploads(now);
        if (!save('pl_plants', allPlants)) toast('저장 공간이 부족해요');
        render();
        toast(Math.floor(now / 3) > before ? `레벨업! Lv.${Math.floor(now / 3) + 1}` : `사진 업로드 완료 (${now % 3}/3)`);
      });
    };
    inp.click();
  }
  if (e.target.closest('.act-del') && confirm(`'${p.nick}'을(를) 삭제할까요?`)) {
    list.splice(list.indexOf(p), 1); save('pl_plants', allPlants); render();
  }
});
$('#list').addEventListener('change', e => {
  if (!e.target.classList.contains('act-water')) return;
  const p = list.find(x => x.id === e.target.closest('.plant').dataset.id), t = todayStr();
  if (e.target.checked) { p.prevWatered = p.lastWatered || null; p.lastWatered = t; }
  else { p.lastWatered = p.prevWatered || null; }
  save('pl_plants', allPlants); render();
});

render();
</script>
</body>
</html>
