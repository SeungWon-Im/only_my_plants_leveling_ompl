<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 내 식물만 레벨업</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f4f7f5;
            color: #121614;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .page-wrapper {
            max-width: 1160px;
            margin: 0 auto;
            padding: 28px 40px 72px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 36px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #121614;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .btn-home {
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            color: #121614;
            background-color: #ffffff;
            border: 1px solid #e1e6e3;
            text-decoration: none;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .btn-home:hover {
            background-color: #eef3f0;
            border-color: #cfd8d2;
        }

        .auth-card {
            max-width: 520px;
            margin: 16px auto 0;
            background-color: #ffffff;
            border: 1px solid #e7ece9;
            border-radius: 32px;
            padding: 44px 40px;
            box-shadow: 0 12px 36px rgba(18, 22, 20, 0.04);
        }

        .card-header {
            margin-bottom: 30px;
        }

        .card-title {
            font-size: 28px;
            font-weight: 800;
            color: #121614;
            letter-spacing: -0.7px;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 15px;
            color: #55605a;
            line-height: 1.5;
        }

        .alert-box {
            background-color: #ffeaea;
            color: #d93025;
            font-size: 13.5px;
            font-weight: 600;
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .success-box {
            background-color: #e9f8ee;
            color: #257a43;
            font-size: 13.5px;
            font-weight: 600;
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 700;
            color: #121614;
        }

        .input-field {
            width: 100%;
            padding: 15px 18px;
            border-radius: 16px;
            border: 1.5px solid #e1e6e3;
            background-color: #fbfcfb;
            font-size: 15px;
            color: #121614;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        .input-field::placeholder {
            color: #9ba59f;
        }

        .input-field:focus {
            border-color: #257a43;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 122, 67, 0.08);
        }

        .card-footer {
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-submit {
            width: 100%;
            padding: 17px 0;
            border-radius: 16px;
            background-color: #141715;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: transform 0.12s, opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .switch-text {
            text-align: center;
            font-size: 14px;
            color: #636e68;
        }

        .switch-text a {
            color: #257a43;
            font-weight: 700;
            text-decoration: none;
            margin-left: 6px;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 560px) {
            .page-wrapper {
                padding: 18px 20px 48px;
            }

            .auth-card {
                padding: 32px 24px;
                border-radius: 26px;
            }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <header class="header">
        <a th:href="@{/}" class="logo">내 식물만 레벨업</a>
        <a th:href="@{/}" class="btn-home">홈으로</a>
    </header>

    <section class="auth-card">
        <div class="card-header">
            <h1 class="card-title">로그인</h1>
            <p class="card-desc">계정에 로그인하고 내 식물의 성장을 확인해 보세요.</p>
        </div>

        <div th:if="${param.signupSuccess}" class="success-box">
            회원가입이 완료되었습니다. 로그인해 주세요.
        </div>

        <div th:if="${param.error != null or errorMessage != null}" class="alert-box">
            <span th:text="${errorMessage != null ? errorMessage : '아이디 또는 비밀번호가 일치하지 않습니다.'}">
                아이디 또는 비밀번호가 일치하지 않습니다.
            </span>
        </div>

        <form class="auth-form" th:action="@{/login}" method="post">
            <div class="input-group">
                <label for="username" class="input-label">아이디</label>
                <input type="text" id="username" name="username" class="input-field" placeholder="아이디를 입력해 주세요" required>
            </div>

            <div class="input-group">
                <label for="password" class="input-label">비밀번호</label>
                <input type="password" id="password" name="password" class="input-field" placeholder="비밀번호를 입력해 주세요" required>
            </div>

            <div class="card-footer">
                <button type="submit" class="btn-submit">로그인</button>
                <p class="switch-text">
                    아직 계정이 없으신가요?
                    <a th:href="@{/signup}">회원가입</a>
                </p>
            </div>
        </form>
    </section>
</div>
</body>
</html>
