<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식물 등록 - 내 식물만 레벨업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#eef1ee; --paper:#ffffff; --ink:#141a16; --sub:#6b7770; --mist:#f1f4f2; --leaf:#19a463; --err:#d6453d; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; -webkit-font-smoothing:antialiased; }
  #app { max-width:440px; min-height:100vh; margin:0 auto; background:var(--paper); padding:20px 22px 130px; }

  .top { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; height:40px; }
  .back { width:40px; height:40px; border-radius:50%; background:var(--mist); display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink); font-size:18px; }
  .top h1 { text-align:center; font-size:17px; font-weight:800; letter-spacing:-0.03em; }

  /* 사진 */
  .photo-wrap { display:flex; justify-content:center; margin:28px 0 8px; }
  .photo { position:relative; width:124px; height:124px; border-radius:50%; background:var(--mist) center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:44px; cursor:pointer; border:0; }
  .photo .cam { position:absolute; right:-6px; bottom:2px; font-size:13px; font-weight:700; background:var(--ink); color:#fff; border-radius:999px; padding:7px 12px; }

  /* 입력 */
  .field { margin-top:20px; }
  .field label { display:block; font-size:13px; font-weight:600; color:var(--sub); margin-bottom:8px; }
  input[type=text], input[type=date] { width:100%; font:inherit; font-size:16px; padding:15px 16px; border:2px solid transparent; border-radius:14px; background:var(--mist); color:var(--ink); outline:none; transition:border-color .15s; }
  input:focus { border-color:var(--leaf); background:#fff; }
  .search { display:flex; gap:8px; }
  .search .go { flex:none; width:54px; border:0; border-radius:14px; background:var(--ink); color:#fff; font-size:18px; cursor:pointer; }

  .sugg { list-style:none; padding:6px; margin-top:8px; border-radius:14px; background:var(--mist); display:none; max-height:190px; overflow:auto; }
  .sugg li { padding:12px 12px; border-radius:10px; font-size:15px; font-weight:500; cursor:pointer; }
  .sugg li:hover, .sugg li:focus-visible { background:#fff; outline:none; }
  .sugg li.none { color:var(--sub); cursor:default; }

  .info { margin-top:16px; padding:18px; border-radius:18px; background:var(--mist); font-size:14px; line-height:1.7; color:var(--sub); }
  .info.on { color:var(--ink); }
  .info dt { font-weight:700; float:left; width:84px; }
  .info dd { margin-left:84px; }
  .err { min-height:20px; margin-top:14px; font-size:14px; color:var(--err); font-weight:600; }

  /* 하단 버튼 */
  .dock { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; pointer-events:none; }
  .dock-in { width:100%; max-width:440px; padding:44px 22px 22px; pointer-events:auto; background:linear-gradient(to top,#fff 62%,rgba(255,255,255,0)); }
  .cta { width:100%; border:0; font:inherit; font-size:17px; font-weight:700; letter-spacing:-0.02em; padding:18px; border-radius:18px; background:var(--ink); color:#fff; cursor:pointer; transition:transform .12s; }
  .cta:active { transform:scale(.98); }
  button:focus-visible, a:focus-visible { outline:3px solid var(--leaf); outline-offset:2px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="back" href="index.html" aria-label="메인으로">←</a>
    <h1 id="title">식물 등록</h1>
    <span></span>
  </header>

  <div class="photo-wrap">
    <button class="photo" id="photo" type="button" aria-label="식물 사진 촬영 또는 선택">
      <span id="photoEmoji">🪴</span><span class="cam">촬영</span>
    </button>
  </div>
  <input type="file" id="file" accept="image/*" capture="environment" hidden>

  <div class="field">
    <label for="nick">별명</label>
    <input type="text" id="nick" maxlength="12" placeholder="예: 초롱이">
  </div>
  <div class="field">
    <label for="date">날짜 (연·월·일)</label>
    <input type="date" id="date">
  </div>
  <div class="field">
    <label for="search">식물 종류</label>
    <div class="search">
      <input type="text" id="search" placeholder="예: 몬스테라" autocomplete="off">
      <button class="go" id="searchBtn" type="button" aria-label="검색">🔍</button>
    </div>
    <ul class="sugg" id="sugg"></ul>
  </div>

  <dl class="info" id="info">물주기, 습도 환경, 특징이 여기에 표시돼요.</dl>
  <div class="err" id="err" role="alert"></div>
</div>

<nav class="dock">
  <div class="dock-in"><button class="cta" id="submit" type="button">등록</button></div>
</nav>

<script>
/* 저장 키: pl_users, pl_session, pl_plants {아이디:[식물]} — 다른 페이지와 공유 */
const $ = s => document.querySelector(s);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e){ return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* login.html 이 완성되면 false -> true 로 바꾸세요 (true: 로그인 안 하면 login.html 로 이동) */
const REQUIRE_LOGIN = false;

const users = load('pl_users', {});
let session = load('pl_session', null);
if (!users[session]) {
  if (REQUIRE_LOGIN) location.replace('login.html');
  session = 'guest';   // 테스트용: 로그인 없이도 화면 확인/저장 가능
}

const SPECIES = [
  { n:'몬스테라',   water:'7일마다',  humid:'50~70%', tip:'반그늘을 좋아하고 잎이 갈라지는 대표 관엽식물' },
  { n:'스투키',     water:'14일마다', humid:'30~50%', tip:'건조에 강해 초보자에게 좋고 과습을 피해야 해요' },
  { n:'산세베리아', water:'14일마다', humid:'30~50%', tip:'공기정화 식물, 어두운 곳에서도 잘 자라요' },
  { n:'선인장',     water:'21일마다', humid:'20~40%', tip:'햇빛을 충분히 받게 하고 물은 아주 가끔 줘요' },
  { n:'스킨답서스', water:'7일마다',  humid:'50~70%', tip:'덩굴성이고 물꽂이도 가능해서 키우기 쉬워요' },
  { n:'고무나무',   water:'7일마다',  humid:'40~60%', tip:'밝은 간접광을 좋아하고 잎을 자주 닦아주면 좋아요' },
  { n:'율마',       water:'3일마다',  humid:'60~70%', tip:'흙이 마르지 않게 관리하고 통풍이 중요해요' },
  { n:'페페로미아', water:'10일마다', humid:'50~60%', tip:'두툼한 잎에 수분을 저장해서 과습을 조심해요' }
];
const findSp = n => SPECIES.find(s => s.n === n);

/* 수정 모드: register.html?edit=식물id */
const editId = new URLSearchParams(location.search).get('edit');
const myPlants = load('pl_plants', {});
const list = myPlants[session] || (myPlants[session] = []);
const editing = editId ? list.find(p => p.id === editId) : null;

let photoData = null, species = null;

function setPhoto(d){
  photoData = d;
  $('#photo').style.backgroundImage = d ? `url(${d})` : '';
  $('#photoEmoji').style.display = d ? 'none' : '';
}
function showInfo(){
  const s = findSp(species), box = $('#info');
  box.classList.toggle('on', !!s);
  box.innerHTML = s
    ? `<dt>물주기</dt><dd>${s.water}</dd><dt>습도 환경</dt><dd>${s.humid}</dd><dt>특징</dt><dd>${esc(s.tip)}</dd>`
    : '물주기, 습도 환경, 특징이 여기에 표시돼요.';
}

/* 초기값 */
const t = new Date(), pad = n => String(n).padStart(2, '0');
$('#date').value = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
if (editing) {
  $('#title').textContent = '식물 정보 수정';
  $('#submit').textContent = '수정';
  $('#nick').value = editing.nick;
  $('#date').value = editing.date || (editing.year ? editing.year + '-01-01' : $('#date').value);
  $('#search').value = editing.species;
  species = editing.species;
  setPhoto(editing.photo);
  showInfo();
}

/* 사진: 작게 줄여서 저장 (localStorage 용량 때문) */
$('#photo').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, 320 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      setPhoto(c.toDataURL('image/jpeg', 0.7));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(f); e.target.value = '';
};

/* 종류 검색 */
function doSearch(){
  const q = $('#search').value.trim(), ul = $('#sugg');
  const res = SPECIES.filter(s => s.n.includes(q));
  ul.innerHTML = res.length ? res.map(s => `<li tabindex="0">${s.n}</li>`).join('') : '<li class="none">검색 결과가 없어요</li>';
  ul.style.display = 'block';
}
function pick(li){
  if (!li || !findSp(li.textContent)) return;
  species = li.textContent; $('#search').value = species;
  $('#sugg').style.display = 'none'; showInfo();
}
$('#search').oninput = () => { species = null; showInfo(); doSearch(); };
$('#searchBtn').onclick = doSearch;
$('#sugg').onclick = e => pick(e.target.closest('li'));
$('#sugg').onkeydown = e => { if (e.key === 'Enter') pick(e.target.closest('li')); };

/* 등록 / 수정 */
$('#submit').onclick = () => {
  const nick = $('#nick').value.trim(), date = $('#date').value, year = date.slice(0, 4);
  if (!nick)    return $('#err').textContent = '별명을 입력해주세요.';
  if (!date)    return $('#err').textContent = '날짜를 선택해주세요.';
  if (!species) return $('#err').textContent = '식물 종류를 검색해서 선택해주세요.';
  if (editing) Object.assign(editing, { nick, date, year, species, photo: photoData });
  else list.push({ id:'p' + Date.now(), nick, date, year, species, photo: photoData, photos:{}, lastWatered:null, prevWatered:null });
  if (!save('pl_plants', myPlants)) return $('#err').textContent = '저장 공간이 부족해요. 사진을 작은 걸로 바꿔주세요.';
  location.href = 'my.html';   // 등록 후 내 식물 페이지로
};
</script>
</body>
</html>
